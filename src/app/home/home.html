<div class="text-white">

  <div class="relative min-h-screen overflow-hidden">

    <div class="absolute inset-0">
      <img
        src="https://plus.unsplash.com/premium_photo-1661963542752-9a8a1d72fb28?q=80&w=2340&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="Background"
        class="w-full h-full object-cover">
    </div>

    <div class="absolute inset-0 bg-gradient-to-br from-black via-yellow-900/70 to-black"></div>

    <div class="relative z-10 flex flex-col min-h-screen">

      <app-header></app-header>

      <main class="flex flex-1">

        <section class="flex-1 flex flex-col items-center justify-center text-center px-6">

          <h1 class="text-4xl md:text-6xl font-bold leading-tight max-w-4xl mt-10">
            Reserve Your Tickets Now <br>
            For Your Next Trip
          </h1>

          <p class="mt-6 text-gray-300 max-w-xl">
            Book your tickets now and get ready for your next adventure —
            easy, fast, and stress-free.
          </p>

          <div class="mt-12 bg-black/40 backdrop-blur-md border border-yellow-700 rounded-3xl p-6 shadow-2xl w-72">
            <div class="bg-gradient-to-br from-yellow-800 to-black rounded-2xl p-4 text-left">
                <h2 class="text-lg font-semibold mb-2">Your Next Trip Awaits</h2>

              <div class="bg-yellow-500 text-black rounded-xl p-1 mb-4">
                <button [routerLink]="['signup']" class="text-l bg-yellow-500 hover:bg-yellow-400 text-black px-10 py-2 rounded-full font-medium">
                    Get Started
                </button>
              </div>

            </div>
          </div>

        </section>
      </main>

    </div>
  </div>
  </div>
