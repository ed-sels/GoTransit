<div class="auth-page">

  <div class="auth-bg">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>

  <div class="auth-container">

    <div class="form-panel">

      <div class="form-header">
        <h2 class="form-title">Welcome Back</h2>
        <p class="form-subtitle">Sign in to access your account</p>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        <span>{{ errorMessage }}</span>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="auth-form">

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <input
              type="email"
              name="email"
              required
              email
              [(ngModel)]="loginObj.email"
              #emailField="ngModel"
              class="form-input"
              placeholder="you@example.com">
          </div>
          <small class="field-error" *ngIf="emailField.invalid && emailField.touched">
            Please enter a valid email address.
          </small>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              required
              minlength="6"
              [(ngModel)]="loginObj.password"
              #passwordField="ngModel"
              class="form-input"
              placeholder="Enter your password">
            <button type="button" class="toggle-password" (click)="togglePassword()">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
          <small class="field-error" *ngIf="passwordField.invalid && passwordField.touched">
            Password must be at least 6 characters.
          </small>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" class="custom-checkbox">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="submit-btn"
          [class.loading]="isLoading">

          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="btn-loading">
            <span class="spinner"></span>
            Signing in...
          </span>
        </button>

      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR</span>
        <div class="divider-line"></div>
      </div>

      <button class="google-btn">
        Continue with Google
      </button>

      <p class="switch-text">
        Don't have an account?
        <a [routerLink]="['/signup']" class="switch-link">Create one</a>
      </p>

    </div>


</div>
