<div class="auth-page">

  <div class="auth-bg">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>

  <div class="auth-container">

    <div class="form-panel">

      <div class="form-header">
        <h2 class="form-title">Create Account</h2>
        <p class="form-subtitle">Start your journey with GoTransit</p>
      </div>

      <form #signupForm="ngForm" (ngSubmit)="onSignup(signupForm)" class="auth-form">

        <div class="name-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <div class="input-wrapper">
              <input
                type="text"
                name="firstName"
                required
                minlength="2"
                [(ngModel)]="signupObj.firstName"
                #firstName="ngModel"
                class="form-input"
                placeholder="John">
            </div>
            <small class="field-error" *ngIf="firstName.invalid && firstName.touched">
              Required (min 2 chars).
            </small>
          </div>

          <div class="form-group">
            <label class="form-label">Last Name</label>
            <div class="input-wrapper">
              <input
                type="text"
                name="lastName"
                required
                minlength="2"
                [(ngModel)]="signupObj.lastName"
                #lastName="ngModel"
                class="form-input"
                placeholder="Doe">
            </div>
            <small class="field-error" *ngIf="lastName.invalid && lastName.touched">
              Required (min 2 chars).
            </small>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <input
              type="email"
              name="email"
              required
              email
              [(ngModel)]="signupObj.email"
              #emailField="ngModel"
              class="form-input"
              placeholder="you@example.com">
          </div>
          <small class="field-error" *ngIf="emailField.invalid && emailField.touched">
            Please enter a valid email address.
          </small>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              required
              minlength="6"
              [(ngModel)]="signupObj.password"
              #password="ngModel"
              class="form-input"
              placeholder="Create a password">
            <button type="button" class="toggle-password" (click)="togglePassword()">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
          <small class="field-error" *ngIf="password.invalid && password.touched">
            Must be at least 6 characters.
          </small>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              name="confirmPassword"
              required
              [(ngModel)]="signupObj.confirmPassword"
              #confirmPassword="ngModel"
              class="form-input"
              placeholder="Confirm your password">
            <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">
              {{ showConfirmPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
          <small class="field-error"
                 *ngIf="!passwordsMatch && confirmPassword.touched">
            Passwords do not match.
          </small>
        </div>

        <div class="terms-group">
          <label class="checkbox-label">
            <input type="checkbox"
                   name="terms"
                   required
                   [(ngModel)]="signupObj.terms"
                   #terms="ngModel"
                   class="custom-checkbox">
            <span>I agree to the <a href="#" class="terms-link">Terms & Conditions</a></span>
          </label>
          <small class="field-error" *ngIf="terms.invalid && terms.touched">
            You must accept the terms.
          </small>
        </div>
        <button
          type="submit"
          [disabled]="signupForm.invalid || !passwordsMatch || isLoading"
          class="submit-btn"
          [class.loading]="isLoading">

          <span *ngIf="!isLoading">Create Account</span>
          <span *ngIf="isLoading" class="btn-loading">
            <span class="spinner"></span>
            Creating account...
          </span>
        </button>

      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR</span>
        <div class="divider-line"></div>
      </div>

      <button class="google-btn">
        <span class="google-icon">G</span>
        Sign up with Google
      </button>

      <p class="switch-text">
        Already have an account?
        <a [routerLink]="['/Login']" class="switch-link">Sign in</a>
      </p>

    </div>

  </div>

</div>
