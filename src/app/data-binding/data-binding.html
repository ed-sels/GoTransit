<div class="mt-20 ml-20">
  <h4>One Way Data Binding</h4>
    <div>
      <p>1. Interpolation</p>
      <p>{{topic}} {{name}}</p>
    </div>

    <div>
      <p>2. Property Binding</p>
      <input type="text" name="" id="name" [value]="name">
      <div class="h-100 w-70 border border-blue-700 items-center justify-center flex">
        <img [src]="image" alt="">
      </div>
    </div>

    <div>
      <p>3. Event Binding</p>
      <button (click)="onSave()" class="bg-amber-800 rounded-2xl h-10 w-30">Save</button>
      <select name="options" id="options" (change)="onChange()">
        <option value="angular" (click)="onSelect('Angular')">Angular</option>
        <option value="react" (click)="onSelect('React')">React</option>
        <option value="vue" (click)="onSelect('Vue')">Vue</option>
      </select>
    </div>


    <h4>Two Way Data Binding</h4>
    <div>
      <input class="bg-amber-800 rounded-2xl h-10 w-30" type="text" [(ngModel)]="random">
      {{random}}
    </div>

</div>
